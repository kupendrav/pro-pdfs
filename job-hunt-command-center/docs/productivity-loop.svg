<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 560" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="acc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <marker id="loop" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8b5cf6"/>
    </marker>
  </defs>

  <rect width="920" height="560" rx="18" fill="#0b0c10"/>
  <text x="46" y="52" fill="#e7e9f0" font-size="21" font-weight="700">The Productivity Loop</text>
  <text x="46" y="76" fill="#9aa0ae" font-size="12.5">Every roadmap topic moves through five stages — one honest pass beats three rushed ones</text>

  <!-- center -->
  <circle cx="460" cy="315" r="86" fill="none" stroke="#262a35" stroke-width="1.5"/>
  <text x="460" y="308" fill="#e7e9f0" font-size="16" font-weight="700" text-anchor="middle">Consistency</text>
  <text x="460" y="330" fill="#9aa0ae" font-size="11" text-anchor="middle">not intensity</text>
  <text x="460" y="348" fill="#7d8494" font-size="10.5" text-anchor="middle">score 50+ keeps the streak</text>

  <!-- nodes around the circle: 5 positions -->
  <g font-size="13" font-weight="600" text-anchor="middle">
    <!-- top -->
    <g>
      <rect x="390" y="120" width="140" height="48" rx="24" fill="#161627" stroke="#818cf8"/>
      <text x="460" y="149" fill="#c7ceff">1 · Learn</text>
    </g>
    <!-- upper right -->
    <g>
      <rect x="640" y="200" width="150" height="48" rx="24" fill="#1c1a12" stroke="#fbbf24"/>
      <text x="715" y="229" fill="#ffe6ad">2 · Build</text>
    </g>
    <!-- lower right -->
    <g>
      <rect x="600" y="390" width="170" height="48" rx="24" fill="#101c17" stroke="#34d399"/>
      <text x="685" y="419" fill="#b8f5dd">3 · Practice</text>
    </g>
    <!-- lower left -->
    <g>
      <rect x="150" y="390" width="150" height="48" rx="24" fill="#1d1418" stroke="#fb7185"/>
      <text x="225" y="419" fill="#ffd3da">4 · Revise</text>
    </g>
    <!-- upper left -->
    <g>
      <rect x="130" y="200" width="170" height="48" rx="24" fill="#161627" stroke="#8b5cf6"/>
      <text x="215" y="229" fill="#ded3ff">5 · Teach myself</text>
    </g>
  </g>

  <!-- arrows between nodes (clockwise) -->
  <path d="M 540 152 Q 640 168 682 196" fill="none" stroke="#8b5cf6" stroke-width="2" marker-end="url(#loop)"/>
  <path d="M 740 252 Q 752 320 716 384" fill="none" stroke="#8b5cf6" stroke-width="2" marker-end="url(#loop)"/>
  <path d="M 592 414 L 378 414" fill="none" stroke="#8b5cf6" stroke-width="2" marker-end="url(#loop)"/>
  <path d="M 226 384 Q 196 300 200 254" fill="none" stroke="#8b5cf6" stroke-width="2" marker-end="url(#loop)"/>
  <path d="M 306 196 Q 350 160 384 148" fill="none" stroke="#8b5cf6" stroke-width="2" marker-end="url(#loop)"/>

  <!-- repeat label -->
  <g>
    <rect x="356" y="486" width="208" height="34" rx="17" fill="#14161d" stroke="#3b3f8f"/>
    <text x="460" y="508" fill="#a5abe0" font-size="12" font-weight="600" text-anchor="middle">↻ repeat with the next topic</text>
  </g>
</svg>
