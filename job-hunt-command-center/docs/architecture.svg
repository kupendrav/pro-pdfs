<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 700" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="acc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5b6172"/>
    </marker>
  </defs>

  <rect width="920" height="700" rx="18" fill="#0b0c10"/>
  <text x="46" y="52" fill="#e7e9f0" font-size="21" font-weight="700">Job Hunt Command Center — Architecture</text>
  <text x="46" y="76" fill="#9aa0ae" font-size="12.5">Local-first single-page app · zero backend · your data never leaves the device</text>

  <!-- User -->
  <g>
    <rect x="330" y="100" width="260" height="58" rx="12" fill="#14161d" stroke="#262a35"/>
    <text x="460" y="126" fill="#e7e9f0" font-size="14" font-weight="600" text-anchor="middle">User</text>
    <text x="460" y="145" fill="#9aa0ae" font-size="11" text-anchor="middle">Start My Day → focus → review → End My Day</text>
  </g>
  <line x1="460" y1="158" x2="460" y2="188" stroke="#5b6172" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- Dashboard shell -->
  <g>
    <rect x="110" y="192" width="700" height="74" rx="12" fill="#14161d" stroke="#3b3f8f"/>
    <text x="460" y="219" fill="#e7e9f0" font-size="14" font-weight="600" text-anchor="middle">Dashboard Shell — one-page SPA (React + TypeScript + Tailwind)</text>
    <text x="460" y="244" fill="#9aa0ae" font-size="11.5" text-anchor="middle">Today · Tasks · Roadmap · Books · DSA · Jobs · Analytics · Weekly Review · Settings</text>
  </g>

  <line x1="240" y1="266" x2="240" y2="300" stroke="#5b6172" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="460" y1="266" x2="460" y2="300" stroke="#5b6172" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="680" y1="266" x2="680" y2="300" stroke="#5b6172" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- Row: Task engine / Focus timer / Trackers -->
  <g>
    <rect x="110" y="304" width="205" height="118" rx="12" fill="#14161d" stroke="#262a35"/>
    <rect x="126" y="320" width="26" height="4" rx="2" fill="url(#acc)"/>
    <text x="162" y="328" fill="#e7e9f0" font-size="13" font-weight="600">Task Engine</text>
    <text x="126" y="352" fill="#9aa0ae" font-size="11">· schedule templates → daily plan</text>
    <text x="126" y="370" fill="#9aa0ae" font-size="11">· skip · reschedule · drag-to-swap</text>
    <text x="126" y="388" fill="#9aa0ae" font-size="11">· missed-task recovery</text>
    <text x="126" y="406" fill="#9aa0ae" font-size="11">· fixed packing block</text>
  </g>
  <g>
    <rect x="357" y="304" width="205" height="118" rx="12" fill="#14161d" stroke="#262a35"/>
    <rect x="373" y="320" width="26" height="4" rx="2" fill="url(#acc)"/>
    <text x="409" y="328" fill="#e7e9f0" font-size="13" font-weight="600">Focus Timer</text>
    <text x="373" y="352" fill="#9aa0ae" font-size="11">· countdown presets 25/45/60/90</text>
    <text x="373" y="370" fill="#9aa0ae" font-size="11">· fullscreen focus mode</text>
    <text x="373" y="388" fill="#9aa0ae" font-size="11">· live per-task time tracking</text>
    <text x="373" y="406" fill="#9aa0ae" font-size="11">· chime + browser notification</text>
  </g>
  <g>
    <rect x="604" y="304" width="205" height="118" rx="12" fill="#14161d" stroke="#262a35"/>
    <rect x="620" y="320" width="26" height="4" rx="2" fill="url(#acc)"/>
    <text x="656" y="328" fill="#e7e9f0" font-size="13" font-weight="600">Trackers</text>
    <text x="620" y="352" fill="#9aa0ae" font-size="11">· AI/ML roadmap stages</text>
    <text x="620" y="370" fill="#9aa0ae" font-size="11">· book topics + explain-check</text>
    <text x="620" y="388" fill="#9aa0ae" font-size="11">· DSA log + NeetCode 150</text>
    <text x="620" y="406" fill="#9aa0ae" font-size="11">· job applications pipeline</text>
  </g>

  <line x1="212" y1="422" x2="380" y2="462" stroke="#5b6172" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="460" y1="422" x2="445" y2="462" stroke="#5b6172" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="706" y1="422" x2="510" y2="462" stroke="#5b6172" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- Scoring -->
  <g>
    <rect x="240" y="466" width="440" height="88" rx="12" fill="#14161d" stroke="#3b3f8f"/>
    <text x="460" y="493" fill="#e7e9f0" font-size="13.5" font-weight="600" text-anchor="middle">Progress Engine</text>
    <text x="460" y="516" fill="#9aa0ae" font-size="11.5" text-anchor="middle">transparent weighted score · streaks with one-day grace</text>
    <text x="460" y="535" fill="#9aa0ae" font-size="11.5" text-anchor="middle">guardrails (late-night, job-block overrun, task overrun) · analytics</text>
  </g>
  <line x1="460" y1="554" x2="460" y2="584" stroke="#5b6172" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- Storage -->
  <g>
    <rect x="240" y="588" width="440" height="78" rx="12" fill="#14161d" stroke="#262a35"/>
    <rect x="264" y="610" width="46" height="24" rx="6" fill="url(#acc)"/>
    <text x="287" y="626" fill="#ffffff" font-size="11" font-weight="700" text-anchor="middle">JSON</text>
    <text x="328" y="618" fill="#e7e9f0" font-size="13" font-weight="600">Local Storage — zustand persist</text>
    <text x="328" y="637" fill="#9aa0ae" font-size="11">tasks · sessions · logs · settings — with one-click export / import</text>
  </g>
</svg>
