<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="K-PDF's - Free online PDF tools. Merge, split, compress, convert, rotate, watermark PDFs and more." />
    <meta name="theme-color" content="#dc2626" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>K-PDF's - Online PDF Tools</title>

    <!-- Premium typography: Sora (display), Plus Jakarta Sans (UI/body),
         Instrument Serif (editorial accent), JetBrains Mono (technical) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700;800&family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400;1,500&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="bg-[#fafafa] text-slate-800 antialiased">
    <!-- Loading Screen (outside root so React doesn't replace it) -->
    <div id="app-loader" style="position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#0c0c0e;transition:opacity .4s ease">
      <div style="position:absolute;inset:0;background:radial-gradient(600px circle at 50% 40%, rgba(220,38,38,.16), transparent 65%)"></div>
      <img src="/favicon.svg" alt="K-PDF's" style="position:relative;width:80px;height:80px;border-radius:20px;margin-bottom:26px;animation:pulse-logo 1.8s ease-in-out infinite;box-shadow:0 0 60px rgba(220,38,38,.35)" />
      <div style="position:relative;font-family:'Sora',system-ui,sans-serif;font-size:30px;font-weight:700;color:#fff;letter-spacing:-1px;margin-bottom:10px">K-PDF's</div>
      <div style="position:relative;font-family:'Plus Jakarta Sans',system-ui,sans-serif;font-size:13px;font-weight:500;color:#8b8b93;letter-spacing:.14em;text-transform:uppercase;margin-bottom:34px">Loading your PDF toolkit</div>
      <div style="position:relative;width:200px;height:3px;background:#1f1f23;border-radius:4px;overflow:hidden">
        <div style="width:100%;height:100%;background:linear-gradient(90deg,#dc2626,#f87171,#dc2626);background-size:200% 100%;animation:loader-bar 1.2s ease-in-out infinite;border-radius:4px"></div>
      </div>
    </div>
    <style>
      @keyframes pulse-logo {
        0%, 100% { transform: scale(1); opacity: 1; }
        50% { transform: scale(1.06); opacity: .85; }
      }
      @keyframes loader-bar {
        0% { background-position: 200% 0; }
        100% { background-position: -200% 0; }
      }
    </style>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
